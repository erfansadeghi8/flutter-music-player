name: music_player
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  lottie: ^3.5.1
  get_storage: ^2.1.1
  asset_image_generator: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_app.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon_app.png
    - assets/imageWelcome/
    - assets/icon/
    - assets/RecentlyMusic/